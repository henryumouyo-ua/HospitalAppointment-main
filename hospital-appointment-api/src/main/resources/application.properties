# --- Server ---
server.port=8080

# --- MySQL Datasource ---
# Update the URL, username, and password for your local MySQL instance.
# The database "hospital_appointments" will be created automatically if it doesn't exist
# thanks to createDatabaseIfNotExist=true.
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_appointments?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=@3375#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# ddl-auto=update will auto-create/update tables based on your entities.
# Switch to "validate" or "none" once your schema is stable in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Jackson (for LocalDateTime serialization) ---
spring.jackson.serialization.write-dates-as-timestamps=false
